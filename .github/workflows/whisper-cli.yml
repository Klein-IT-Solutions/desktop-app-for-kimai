# Builds whisper.cpp's whisper-cli for Linux and publishes it as a release
# of this repository. whisper.cpp does not ship Linux binaries; the app
# downloads these builds when local transcription is selected.
#
# Run manually: Actions → whisper-cli → Run workflow (whisper.cpp tag).
# Keep the tag in sync with voice.WhisperCLIVersion in internal/voice/binary.go.
name: whisper-cli

on:
  workflow_dispatch:
    inputs:
      version:
        description: whisper.cpp release tag
        required: true
        default: v1.9.5

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04 # glibc 2.35 → runs on Ubuntu 22.04 and newer
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Fetch whisper.cpp ${{ inputs.version }}
        run: git clone --depth 1 --branch "${{ inputs.version }}" https://github.com/ggml-org/whisper.cpp

      - name: Build (static, portable)
        working-directory: whisper.cpp
        run: |
          # Static libraries, no OpenMP (libgomp is not installed everywhere),
          # static C++ runtime: the binary only needs libc/libm.
          # GGML_NATIVE=OFF targets AVX2/FMA (x64) instead of the build machine.
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build -j"$(nproc)" --target whisper-cli
          strip build/bin/whisper-cli
          ldd build/bin/whisper-cli
          ./build/bin/whisper-cli --help > /dev/null

      - name: Package
        run: |
          name="whisper-cli-${{ inputs.version }}-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp whisper.cpp/build/bin/whisper-cli "$name/"
          cp whisper.cpp/LICENSE "$name/LICENSE-whisper.cpp"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: whisper-cli-${{ matrix.arch }}
          path: whisper-cli-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release whisper-cli-${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: whisper-cli-${{ inputs.version }}
        run: |
          ls -la dist
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" dist/* --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "whisper-cli ${{ inputs.version }} (Linux)" \
              --notes "Static Linux builds of [whisper.cpp](https://github.com/ggml-org/whisper.cpp) ${{ inputs.version }} (MIT license) used by Kimai Tracker for local transcription. Downloaded automatically by the app."
          fi
