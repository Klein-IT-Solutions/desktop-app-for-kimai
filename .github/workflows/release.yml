# Builds a new release with its own version and tag.
#
# Two ways to release:
#   1. Actions → Release → Run workflow, choose patch / minor / major:
#      the next version is derived from the latest v* tag (v0.1.0 → v0.1.1),
#      the tag is created and the release is built from it.
#   2. Push a tag yourself: git tag v1.2.3 && git push origin v1.2.3
#
# The version is compiled into the app and used for the .deb and AppImage.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and create tag
        id: v
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
            if [ -z "$last" ]; then
              tag="v0.1.0"
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              case "$BUMP" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                *)     patch=$((patch + 1)) ;;
              esac
              tag="v${major}.${minor}.${patch}"
            fi
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::error::Tag $tag already exists"; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Kimai Tracker $tag"
            git push origin "$tag"
          fi
          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag $tag is not a version like v1.2.3"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag" >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: version
    runs-on: ubuntu-24.04 # GTK 4 / WebKitGTK 6.0
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APPIMAGE_EXTRACT_AND_RUN: "1" # AppImage tools without FUSE
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake file \
            libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Tools and frontend dependencies
        run: make deps

      - name: Test
        run: make test

      - name: Build packages
        run: make package VERSION="$VERSION"

      - name: Collect artifacts
        run: |
          mkdir dist
          cp bin/kimai-tracker.deb "dist/kimai-tracker_${VERSION}_amd64.deb"
          cp bin/kimai-tracker-x86_64.AppImage "dist/Kimai-Tracker-${VERSION}-x86_64.AppImage"
          chmod +x dist/*.AppImage
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  release:
    needs: [version, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          ## Installation (Linux)

          - **Ubuntu 24.04+ / Debian 13+:** \`sudo apt install ./kimai-tracker_${VERSION}_amd64.deb\`
          - **Other distributions:** download \`Kimai-Tracker-${VERSION}-x86_64.AppImage\`, make it executable (\`chmod +x\`) and start it.

          Checksums: \`SHA256SUMS\`.
          NOTES
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Kimai Tracker $TAG" \
            --notes-file notes.md \
            --generate-notes \
            $prerelease
